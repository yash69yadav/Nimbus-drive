services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nimbus
      MONGO_INITDB_ROOT_PASSWORD: nimbus-dev-password
      MONGO_INITDB_DATABASE: nimbus_drive
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 4173
      NODE_ENV: production
      MONGODB_URI: mongodb://nimbus:nimbus-dev-password@mongo:27017/?authSource=admin
      MONGODB_DB: nimbus_drive
      JWT_SECRET: change-this-before-deploying
      UPLOAD_MAX_BYTES: 104857600
    ports:
      - "4173:4173"
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  mongo_data:
